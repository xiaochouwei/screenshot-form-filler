<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>截图填表 · 网站访问</title><link rel="stylesheet" href="panel.css"></head><body>
<header class="app-header"><h1>网站访问</h1><span class="local-tag">本机处理</span></header>
<main><section><h2 id="site">当前网站</h2><p id="permission-state" class="muted"></p><button id="grant-site" class="button match-button">允许此网站</button><button id="grant-all" class="button match-button">允许所有网站</button><p id="setup-status" class="status" role="status"></p></section>
<section><label for="capture-layout">截图后显示</label><select id="capture-layout"><option value="sidepanel">浏览器侧栏</option><option value="window">独立图片窗口</option></select><p id="shortcut" class="muted"></p><button id="shortcuts" class="button">快捷键设置</button></section></main><script src="setup.js"></script></body></html>
